server {
    # Railway (and similar PaaS) route traffic to an injected $PORT, so the
    # listen directive has to be templated rather than fixed at 80.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached (it references hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    # Telegram Desktop/Web embed the Mini App in an iframe on web.telegram.org.
    # X-Frame-Options: SAMEORIGIN would block it, so allow those origins via CSP.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
