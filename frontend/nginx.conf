server {
    # Railway (and similar PaaS) route traffic to an injected $PORT, so the
    # listen directive has to be templated rather than fixed at 80.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # NOTE: nginx does NOT merge add_header across levels - a location that
    # declares any add_header of its own drops every inherited one. Security
    # headers are therefore repeated inside each location, otherwise they are
    # silently missing and Telegram's iframe is blocked by the default policy.

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must never be cached (it references hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        # Telegram Desktop/Web embed the Mini App in an iframe on web.telegram.org.
        # X-Frame-Options: SAMEORIGIN would block it, so allow those origins via CSP.
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
