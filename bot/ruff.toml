# Ruff configuration for the bot service.
# Mirrors backend/ruff.toml so both Python services in this repo are linted with
# the same rule set.
target-version = "py312"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # warnings
    "F",    # pyflakes (unused imports/variables, undefined names)
    "I",    # import sorting
    "UP",   # pyupgrade modernisation
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff specific
]
ignore = [
    # Line length is handled by the formatter.
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM105",
]

[lint.per-file-ignores]
# bot.py must put the project root on sys.path before importing bot.admin, so the
# package imports legitimately follow code.
"bot.py" = ["E402"]

[lint.isort]
known-first-party = ["bot"]

[format]
quote-style = "double"
indent-style = "space"