[pytest]
# Workspace-root config: `pytest` from anywhere collects only the real suites.
# `pythonpath` makes the `app` package importable without installing it.
testpaths = backend/tests bot/tests
pythonpath = backend .
asyncio_mode = auto
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
