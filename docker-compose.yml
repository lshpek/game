name: numora

services:
  postgres:
    image: postgres:16-alpine
    container_name: miniapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miniapp}
      POSTGRES_USER: ${POSTGRES_USER:-miniapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniapp} -d ${POSTGRES_DB:-miniapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published by default: only the backend needs it.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    container_name: miniapp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-miniapp}:${POSTGRES_PASSWORD:-miniapp}@postgres:5432/${POSTGRES_DB:-miniapp}
      ALLOW_DEV_LOGIN: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/health', timeout=4).status_code == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: miniapp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: ./bot
    container_name: miniapp-bot
    restart: unless-stopped
    # Opt-in: `docker compose --profile bot up -d`
    profiles: ["bot"]
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
